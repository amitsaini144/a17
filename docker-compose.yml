services:
  db:
    image: postgres:17-alpine
    container_name: a17-postgres
    environment:
      POSTGRES_USER: a17
      POSTGRES_PASSWORD: a17
      POSTGRES_DB: a17
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a17 -d a17"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
