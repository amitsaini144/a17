# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: a17-api
    runtime: docker
    plan: free
    # Must match the Neon project's region (AWS ap-southeast-1): every query pays the round trip.
    # Vercel functions (ui/vercel.json) run in Singapore too, since they proxy /api/* here.
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    # Fails the deploy (old version keeps serving) if the new one can't reach the database.
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: ENVIRONMENT
        value: production
      # Neon connection string, pasted as-is. Secret: set in the dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      # Signs session tokens. Render generates a random value once; it never leaves Render.
      # Rotating it only invalidates current access tokens; browsers then refresh to new ones.
      - key: JWT_SECRET
        generateValue: true
      # Stripe test-mode keys and the webhook endpoint's signing secret. Secrets: set in the
      # dashboard. PUBLIC_SITE_URL is the UI origin Stripe sends shoppers back to.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
